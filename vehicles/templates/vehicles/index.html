<!DOCTYPE html>
<html>
<head>
<title>Vehicle ML Dashboard</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">
<style>
body {
background-color: #f4f6f9;
}
.scrollspy-example {
height: 80vh;
overflow-y: scroll;
position: relative;
}
.nav-pills .nav-link.active {
background-color: #0d6efd;
}
</style>
</head>
<body data-bs-spy="scroll" data-bs-target="#dashboard-nav" data-bs-offset="100"
tabindex="0">
<div class="container-fluid mt-4">
<div class="row">
<!-- Sidebar Navigation -->
<div class="col-md-3">
<div id="dashboard-nav" class="list-group position-sticky top-
0">
<a class="list-group-item list-group-item-action"
href="#frequency-table-section">Frequency Tables (One-way)
</a>
<a class="list-group-item list-group-item-action"
href="#vehicles-over-5000-section">Vehicles Under 20000
</a>
<a class="list-group-item list-group-item-action"
href="#total-price-by-manufacturer-section">Price by Manufacturer and Transmission
</a>
</div>
</div>
<!-- Scrollable Content -->
<div class="col-md-9">
<div class="scrollspy-example" data-bs-spy="scroll" data-bs-
target="#dashboard-nav"
data-bs-smooth-scroll="true" tabindex="0">
<h1 class="text-center text-primary mb-4"> Vehicle Machine
Learning Dashboard </h1>
{{ frequency_table|safe }}
<br><br>
{{ vehicles_over_5000_table|safe }}
<br><br>
{{ total_price_by_manufacturer_table|safe }}
</div>
</div>
</div>
</div>
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.
js"></script>
</body>
</html>
